<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic latent space · 3D illustration</title><style>*{box-sizing:border-box}body{margin:0;background:#111721;color:#a7b2c4;font:12px system-ui}canvas{display:block;width:100%;height:100vh;touch-action:none;cursor:grab}canvas:focus-visible{outline:2px solid #bcf587;outline-offset:-3px}.label{position:absolute;top:20px;left:22px;pointer-events:none;line-height:1.7;letter-spacing:1px}.legend{position:absolute;bottom:18px;left:22px;pointer-events:none}.legend span{margin-right:18px}button{position:absolute;right:18px;top:18px;background:#202b39;border:1px solid #435065;color:#eef2f8;padding:8px 13px;border-radius:5px;cursor:pointer}</style></head><body><div class="label">SYNTHETIC EMBEDDING SPACE<br><small>255 points / 3 illustrative clusters</small></div><canvas tabindex="0" aria-label="3D synthetic clusters. Arrow keys rotate; plus and minus zoom; R resets."></canvas><button type="button">Reset view</button><div class="legend"><span style="color:#bcf587">● Cluster A</span><span style="color:#83cfff">● Cluster B</span><span style="color:#b9a1ff">● Cluster C</span></div><script>
const points=__POINTS__,canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let yaw=.45,pitch=.3,zoom=1,drag=null,w=0,h=0;const colors=['#bcf587','#83cfff','#b9a1ff'];
function resize(){const d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);draw()}
function project(x,y,z){let a=x*Math.cos(yaw)+z*Math.sin(yaw),b=-x*Math.sin(yaw)+z*Math.cos(yaw),c=y*Math.cos(pitch)-b*Math.sin(pitch),depth=y*Math.sin(pitch)+b*Math.cos(pitch);let s=Math.min(w,h)*.31*zoom*4/(4+depth);return [w/2+a*s,h/2-c*s,depth,s]}
function draw(){ctx.clearRect(0,0,w,h);ctx.lineWidth=1;for(let i=-2;i<=2;i++){for(const axis of [0,1]){const a=axis?project(i,-1.5,-2):project(-2,-1.5,i),b=axis?project(i,-1.5,2):project(2,-1.5,i);ctx.strokeStyle='#293545';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}}points.map(p=>[...project(...p),p[3]]).sort((a,b)=>b[2]-a[2]).forEach(p=>{ctx.globalAlpha=Math.max(.3,Math.min(1,.8-p[2]*.13));ctx.fillStyle=colors[p[4]];ctx.beginPath();ctx.arc(p[0],p[1],Math.max(1.4,Math.min(5,p[3]*.024)),0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1}
function reset(){yaw=.45;pitch=.3;zoom=1;draw()}canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.009;pitch=Math.max(-1.4,Math.min(1.4,pitch+(e.clientY-drag[1])*.009));drag=[e.clientX,e.clientY];draw()});for(const t of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(t,()=>drag=null);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.5,Math.min(1.8,zoom-e.deltaY*.001));draw()},{passive:false});canvas.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','r','R'].includes(e.key))return;e.preventDefault();if(e.key==='ArrowLeft')yaw-=.1;if(e.key==='ArrowRight')yaw+=.1;if(e.key==='ArrowUp')pitch-=.1;if(e.key==='ArrowDown')pitch+=.1;if(e.key==='+'||e.key==='=')zoom=Math.min(1.8,zoom+.1);if(e.key==='-')zoom=Math.max(.5,zoom-.1);if(e.key.toLowerCase()==='r')reset();draw()});canvas.addEventListener('dblclick',reset);document.querySelector('button').addEventListener('click',reset);addEventListener('resize',resize);resize();
</script></body></html>
